services:
  dragonfly_db:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: FlexDashV4Dragonfly
    restart: unless-stopped
    ulimits:
      memlock: -1
    ports:
      - "3001:6379"
    volumes:
      - dragonflydata:/data
    command: 
      - "--snapshot_cron=*/5 * * * *"

  ntp:
    image: cturra/ntp:latest
    container_name: FlexDashV4NTP
    restart: unless-stopped
    ports:
      - "3002:123/udp"
    environment:
      - NTP_SERVERS=time.cloudflare.com, time.google.com



volumes:
  dragonflydata: 