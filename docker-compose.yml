services:
  dragonfly_db:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: FlexDashV6Dragonfly
    restart: unless-stopped
    ulimits:
      memlock: -1
    ports:
      - "65501:6379"
    volumes:
      - dragonflydata:/data
    command: 
      - "--snapshot_cron=*/5 * * * *"

  ntp:
    image: docker.io/cturra/ntp:latest
    container_name: FlexDashV6NTP
    restart: unless-stopped
    ports:
      - "65502:123/udp"
    environment:
      - NTP_SERVERS=time.cloudflare.com, time.google.com

volumes:
  dragonflydata: 