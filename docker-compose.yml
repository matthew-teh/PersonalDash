services:
  redis:
    image: redis:alpine
    container_name: FlexDashRedis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --save 300 1

  ntp:
    image: cturra/ntp:latest
    container_name: FlexDashNTP
    restart: unless-stopped
    environment:
      - NTP_SERVERS=time.cloudflare.com, time.google.com

  flexdash:
    image: nuggetteh/personal-dashboard:latest
    container_name: FlexDashAPP
    ports:
      - "3000:3000"
    restart: unless-stopped
    

volumes:
  redis_data: