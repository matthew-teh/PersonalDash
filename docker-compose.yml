services:
  dragonfly_db:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: FlexDashV5Dragonfly
    restart: unless-stopped
    ulimits:
      memlock: -1
    ports:
      - "65501:6379"
    volumes:
      - dragonflydata:/data
    command: 
      - "--snapshot_cron=*/5 * * * *"

  ntp:
    image: cturra/ntp:latest
    container_name: FlexDashV5NTP
    restart: unless-stopped
    ports:
      - "65502:123/udp"
    environment:
      - NTP_SERVERS=time.cloudflare.com, time.google.com

  flexdash:
    image: nuggetteh/personal-dashboard:flexdashv5
    container_name: FlexDashAPPV5
    ports:
      - "65510:65510"
    restart: unless-stopped

volumes:
  dragonflydata: 